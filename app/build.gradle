import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    defaultConfig {
        applicationId "com.antest1.gotobrowser"
        minSdkVersion 24
        compileSdk 36
        targetSdkVersion 36
        versionCode 94
        versionName "4.1"
        setProperty("archivesBaseName", "gotobrowser-$versionName")
        multiDexEnabled true

        buildTypes {
            release {
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    namespace 'com.antest1.gotobrowser'

    // Doc screenshots: renders the Compose UI on the JVM (Robolectric + Roborazzi).
    // Run with: gradlew :app:testDebugUnitTest --tests "*DocScreenshotTest*" -Pdocshots
    // -Pdocshots matches the debug app id to the dummy src/debug/google-services.json.
    if (project.hasProperty('docshots')) {
        buildTypes { debug { applicationIdSuffix '.debug' } }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'roborazzi.test.record', 'true'
                systemProperty 'robolectric.graphicsMode', 'NATIVE'
                systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
                systemProperty 'docshots.outDir', rootProject.file('tools/docshots/out').absolutePath
                systemProperty 'docshots.inputDir', rootProject.file('tools/docshots/input').absolutePath
                maxHeapSize = '2g'
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:21.0.1'
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation "com.google.android.material:material:1.14.0"
    implementation 'com.google.code.gson:gson:2.15.0'

    // Force 16 KB page-size compliant version of graphics-path
    implementation 'androidx.graphics:graphics-path:1.1.0'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

    // Doc screenshots (JVM only, not shipped)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.77.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.77.0'
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}