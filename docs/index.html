<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GotoBrowser</title>
    <script>
        // Apply the color theme before the page paints: ?theme= (e.g. from the app),
        // then the visitor's choice, then the system setting.
        (function () {
            var theme = new URLSearchParams(location.search).get("theme");
            if (theme !== "light" && theme !== "dark") {
                try { theme = localStorage.getItem("theme"); } catch (e) { theme = null; }
            }
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <!-- Pretendard (ko / en) and Pretendard JP (ja), loaded per glyph subset -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header class="app-bar">
        <div class="app-bar-inner">
            <button class="app-bar-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                    aria-controls="sidebar" aria-label="Menu">
                <i class="bi bi-list"></i>
            </button>
            <a class="brand" href="?" id="brand-link">
                <img src="https://gotobrowser-docs.s3.ap-northeast-1.amazonaws.com/common/icon_256.png" alt="" width="28" height="28">
                <span data-text="nav_app_brand"></span>
            </a>
            <div class="app-bar-actions">
                <button class="app-bar-btn" type="button" id="theme-toggle" aria-label="Toggle dark mode">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <div class="dropdown">
                    <button class="app-bar-btn app-bar-lang" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-translate"></i><span id="lang-code" class="d-none d-sm-inline"></span>
                        <i class="bi bi-chevron-down small"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" type="button" data-lang="ko">한국어</button></li>
                        <li><button class="dropdown-item" type="button" data-lang="ja">日本語</button></li>
                        <li><button class="dropdown-item" type="button" data-lang="en">English</button></li>
                        <li><button class="dropdown-item" type="button" data-lang="zh-cn">简体中文</button></li>
                        <li><button class="dropdown-item" type="button" data-lang="zh-tw">繁體中文</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- The page scrolls below the app bar, so the scrollbar starts under it -->
    <div class="page-scroll" id="page-scroll">
    <div class="layout">
        <!-- Inline column on large screens, slide-in drawer below that -->
        <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebar-title">
            <div class="offcanvas-header">
                <span class="brand brand-drawer" id="sidebar-title">
                    <img src="https://gotobrowser-docs.s3.ap-northeast-1.amazonaws.com/common/icon_256.png" alt="" width="28" height="28">
                    <span data-text="nav_app_brand"></span>
                </span>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <nav class="nav-tree">
                    <div class="nav-group">
                        <div class="nav-group-title"><i class="bi bi-rocket-takeoff"></i><span data-text="sidebar_group_getstarted"></span></div>
                        <a class="nav-page" data-page="index"><span data-text="sidebar_page_index"></span></a>
                        <a class="nav-page" data-page="installation"><span data-text="sidebar_page_installation"></span></a>
                    </div>
                    <div class="nav-group">
                        <div class="nav-group-title"><i class="bi bi-book"></i><span data-text="sidebar_group_manual"></span></div>
                        <a class="nav-page" data-page="entrance"><span data-text="sidebar_page_entrance"></span></a>
                        <a class="nav-page" data-page="browserui"><span data-text="sidebar_page_browserui"></span></a>
                        <a class="nav-page" data-page="settings"><span data-text="sidebar_page_settings"></span></a>
                    </div>
                    <div class="nav-group">
                        <div class="nav-group-title"><i class="bi bi-grid"></i><span data-text="sidebar_group_functions"></span></div>
                        <a class="nav-page" data-page="screenshot"><span data-text="sidebar_page_screenshot"></span></a>
                        <a class="nav-page" data-page="voiceline"><span data-text="sidebar_page_voiceline"></span></a>
                        <a class="nav-page" data-page="gadgetbypass"><span data-text="sidebar_page_gadgetbypass"></span></a>
                        <a class="nav-page" data-page="kcanotify"><span data-text="sidebar_page_kcanotify"></span></a>
                        <a class="nav-page" data-page="pipmode"><span data-text="sidebar_page_pipmode"></span></a>
                    </div>
                    <div class="nav-group">
                        <div class="nav-group-title"><i class="bi bi-life-preserver"></i><span data-text="sidebar_group_others"></span></div>
                        <a class="nav-page" data-page="knownissue"><span data-text="sidebar_page_knownissue"></span></a>
                        <a class="nav-page" data-page="privacy"><span data-text="sidebar_page_privacy"></span></a>
                    </div>
                </nav>
            </div>
        </aside>

        <main class="content">
            <div class="breadcrumb-line" id="breadcrumb"></div>
            <article id="rendered-md-content"></article>
            <nav class="pager" id="pager" aria-label="Pages"></nav>
        </main>

        <aside class="toc" id="toc-panel" aria-label="On this page">
            <div class="toc-inner">
                <div class="toc-title" id="toc-title"></div>
                <ul id="toc"></ul>
            </div>
        </aside>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="static/script.js"></script>
</body>
</html>
